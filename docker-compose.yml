# Portainer: Stacks > Add stack > Repository. Compose path: docker-compose.yml
# Enable "Re-pull image and redeploy" / GitOps updates to auto-update on new commits.
services:
  etsy-tracker:
    build: .
    container_name: etsy-tracker
    environment:
      - DB_PATH=/data/etsy.db
      - TZ=Europe/London
    volumes:
      - /mnt/user/appdata/etsy-tracker/data:/data
    ports:
      - "${ETSY_PORT:-5075}:5055"
    restart: unless-stopped
