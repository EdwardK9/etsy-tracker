<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy Tracker</title>
<style>
:root{--inp:#0b0e14;--hover:#ffffff08;--hover2:#ffffff05;--th:#ffffff04;--glow:#1a1f2e55;--over:#05070bb0;--shadow:#00000030;--bg:#0a0c11;--side:#0e1117;--card:#131720;--card2:#181d29;--line:#222838;--text:#e9ebf2;--mute:#8a93a8;--acc:#ff7a3d;--acc2:#f0461e;--good:#34d399;--bad:#f87171;--r:14px}
*{box-sizing:border-box}
html{color-scheme:dark}
[data-theme=light]{color-scheme:light;--bg:#f4f5f8;--side:#ffffff;--card:#ffffff;--card2:#f1f3f7;--line:#e2e5ec;--text:#161a23;--mute:#667088;--inp:#ffffff;--hover:#0000000a;--hover2:#00000006;--th:#00000005;--glow:#ffd9c455;--over:#1b223080;--shadow:#1b223014;--good:#0f9d6b;--bad:#dc3d3d}
[data-theme=light] .note{color:#3b4357}[data-theme=light] .card.hero{background:linear-gradient(135deg,#ff7a3d1f,#f0461e0d),var(--card)}[data-theme=light] .modal>div{box-shadow:0 30px 80px #1b223040}[data-theme=light] #toast{box-shadow:0 12px 40px #1b223030}[data-theme=light] .logo i{box-shadow:0 6px 16px #ff7a3d55}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,var(--glow),transparent),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 18px;letter-spacing:-.2px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 6px 20px #ff7a3d44}
.theme{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:500}
.theme:hover{color:var(--text);border-color:var(--acc)}
.theme svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:820px){.theme{margin:0 0 0 auto;padding:8px}.theme span{display:none}}
.ver{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:1px}
.logo svg{width:18px;height:18px;stroke:#fff}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--mute);padding:9px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500;text-align:left;transition:.15s}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{background:var(--hover);color:var(--text)}
nav button.on{background:linear-gradient(90deg,#ff7a3d26,#ff7a3d0d);color:var(--text);box-shadow:inset 2px 0 0 var(--acc)}
nav button.on svg{color:var(--acc)}
main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1240px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.4px}
.sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 #ffffff06 inset,0 8px 24px var(--shadow)}
.card .l{color:var(--mute);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.card .l svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.6px}
.card.hero{background:linear-gradient(135deg,#ff7a3d22,#f0461e0f),var(--card);border-color:#ff7a3d44}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.wrap{overflow-x:auto;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
tr+tr td{border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:var(--th)}
tbody tr:hover td,tr:hover>td{background:var(--hover2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
h2{font-size:13px;margin:26px 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button.b,a.b{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px #f0461e33;transition:.15s}
button.b:hover,a.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
a.b.alt,button.b.alt{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--text);font-weight:500}
button.g{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px;transition:.15s}
button.g:hover{border-color:var(--acc);color:var(--text)}
input,select,textarea{background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;width:100%;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #ff7a3d22}
input[type=checkbox]{accent-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:500}
.modal{position:fixed;inset:0;background:var(--over);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:20}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:580px;box-shadow:0 30px 80px #000a;animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:#34d3991a;color:var(--good);font-weight:600}
.pick{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;margin-top:6px;cursor:pointer;transition:.15s}
.pick:hover{border-color:var(--acc)}
.note{background:#ff7a3d10;border:1px solid #ff7a3d33;border-radius:12px;padding:12px 14px;margin-bottom:16px;color:#c9cfdd;font-size:13px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:30;box-shadow:0 12px 40px #000a}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:18px 18px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow-x:auto}
.col{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.col .bars{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center}
.col .bars span{width:42%;max-width:22px;border-radius:6px 6px 2px 2px;min-height:2px}
.col small{color:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin:-14px 0 20px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
@media(max-width:820px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:0 8px 0 4px}.logo b{display:none}nav{flex-direction:row}nav button{padding:8px 11px;white-space:nowrap}nav button span{display:none}nav button.on span{display:inline}main{padding:18px 14px 50px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg></i><b>Etsy Tracker<small id="ver" class="ver"></small></b></div><nav id="nav"></nav><button class="theme" id="theme" title="Toggle light / dark"></button></aside><main id="main"></main></div>
<div id="toast"></div>
<script>
const ICONS = {
  logo:'<path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  products:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  stock:'<path d="M6 9V3h12v6M4 9h16v8H4zM8 17v4M16 17v4"/>',
  sales:'<path d="M3 3h2l2.4 11.4a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 7H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  expenses:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  import:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  money:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  truck:'<path d="M1 6h13v11H1zM14 10h5l3 3v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/>',
  alert:'<path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cart:'<path d="M3 3h2l2.4 11.4a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 7H6"/>',
};
const ic = n => `<svg viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {}, PRODUCTS = [];
const cur = () => S.currency || '£';
const money = n => (n < 0 ? '-' : '') + cur() + Math.abs(+n || 0).toFixed(2);
const cls = n => n > 0 ? 'good' : n < 0 ? 'bad' : '';
const today = () => new Date().toISOString().slice(0, 10);

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.borderColor = bad ? 'var(--bad)' : 'var(--line)';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

const TABS = [['dashboard','Dashboard'],['products','Products'],['stock','Printing & Stock'],['sales','Sales'],['expenses','Expenses'],['import','Import'],['settings','Settings']];
const TITLES = Object.fromEntries(TABS);
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#theme'); if (b) b.innerHTML = (t === 'light' ? MOON + '<span>Dark mode</span>' : SUN + '<span>Light mode</span>');
}
(function () {
  let t = null; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light') t = 'dark';
  applyTheme(t);
  $('#theme').onclick = () => { t = t === 'light' ? 'dark' : 'light'; applyTheme(t); try { localStorage.setItem('theme', t); } catch (e) {} };
})();
function nav() {
  const cur = location.hash.slice(1) || 'dashboard';
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${k === cur ? 'on' : ''}" onclick="location.hash='${k}'">${ic(k)}<span>${l}</span></button>`).join('');
  return cur;
}
async function route() {
  const t = nav();
  if (!route.v) { try { route.v = (await api('GET', '/api/version')).version; } catch (e) { route.v = '?'; } }
  $('#ver').textContent = 'v' + route.v;
  S = await api('GET', '/api/settings');
  PRODUCTS = await api('GET', '/api/products');
  await safe(() => VIEWS[t]());
}
window.addEventListener('hashchange', route);

function modal(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div>${html}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  return m;
}
const prodOptions = (sel, activeOnly = true) => PRODUCTS.filter(p => !activeOnly || p.active || p.id == sel)
  .map(p => `<option value="${p.id}" ${p.id == sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

/* ---------------- Dashboard ---------------- */
let RANGE = 'all';
function rangeDates() {
  const d = new Date(), y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0');
  if (RANGE === 'month') return [`${y}-${m}-01`, `${y}-${m}-31`];
  if (RANGE === 'year') return [`${y}-01-01`, `${y}-12-31`];
  if (RANGE === '30') { const f = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10); return [f, today()]; }
  return ['', ''];
}
async function dashboard() {
  const [f, t] = rangeDates();
  const D = await api('GET', `/api/dashboard?from=${f}&to=${t}`);
  const T = D.totals;
  const maxV = Math.max(1, ...D.months.map(m => Math.max(m.revenue, Math.abs(m.profit))));
  $('#main').innerHTML = `
  <div class="top"><h1>Dashboard</h1><span class="sp"></span><select id="rng" style="width:auto">
    ${[['all','All time'],['year','This year'],['month','This month'],['30','Last 30 days']].map(([k, l]) => `<option value="${k}" ${k === RANGE ? 'selected' : ''}>${l}</option>`).join('')}
  </select></div>
  <div class="cards">
    ${card('Net profit', money(T.net), cls(T.net), 'trend', 'hero')}${card('Revenue', money(T.revenue), '', 'money')}
    ${card('Items sold', T.items, '', 'cart')}${card('Orders', T.orders, '', 'sales')}
  </div>
  <div class="cards">
    ${card('Etsy fees', money(-T.fees), '', 'tag')}${card('Postage', money(-T.postage), '', 'truck')}
    ${card('Material (sold items)', money(-T.cogs), '', 'box')}${card('Failed prints', money(-T.waste), '', 'alert')}${card('Other expenses', money(-T.expenses), '', 'expenses')}
  </div>
  <div class="cards">
    ${card('Stock on hand', T.stock_units + ' items', '', 'products')}${card('Stock value (at cost)', money(T.stock_value), '', 'stock')}${card('Spent on printing', money(T.spent_printing), '', 'box')}
  </div>
  ${D.low_stock.length ? `<div class="note">⚠️ Low stock: ${D.low_stock.map(l => `<b>${esc(l.name)}</b> (${l.stock} left)`).join(', ')}</div>` : ''}
  <h2>Monthly performance</h2>
  ${D.months.length ? `<div class="chart">${D.months.map(m => `<div class="col"><div class="bars" title="${m.month}: revenue ${money(m.revenue)}, profit ${money(m.profit)}">
      <span style="height:${Math.max(m.revenue / maxV * 100, 1)}%;background:linear-gradient(180deg,var(--acc),var(--acc2))"></span>
      <span style="height:${Math.max(Math.abs(m.profit) / maxV * 100, 1)}%;background:${m.profit >= 0 ? 'var(--good)' : 'var(--bad)'}"></span></div><small>${m.month.slice(2)}</small></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--acc)"></i>Revenue</span><span><i style="background:var(--good)"></i>Profit</span></div>` : '<div class="card mute">No data yet — record a sale to see the chart.</div>'}
  <div class="wrap"><table><tr><th>Month</th><th class="r">Revenue</th><th class="r">Expenses</th><th class="r">Profit</th></tr>
  ${D.months.map(m => `<tr><td>${m.month}</td><td class="r">${money(m.revenue)}</td><td class="r">${money(m.expenses)}</td><td class="r ${cls(m.profit)}">${money(m.profit)}</td></tr>`).join('') || '<tr><td colspan=4 class="mute">No data yet.</td></tr>'}
  </table></div>
  <h2>By product</h2><div class="wrap"><table><tr><th>Product</th><th class="r">Sold</th><th class="r">Revenue</th><th class="r">Profit</th></tr>
  ${D.products.map(p => `<tr><td>${esc(p.product)}</td><td class="r">${p.qty}</td><td class="r">${money(p.revenue)}</td><td class="r ${cls(p.profit)}">${money(p.profit)}</td></tr>`).join('') || '<tr><td colspan=4 class="mute">No sales yet.</td></tr>'}
  </table></div>
  ${D.expense_categories.length ? `<h2>Expenses by category</h2><div class="wrap"><table>${D.expense_categories.map(c => `<tr><td>${esc(c.category)}</td><td class="r">${money(c.amount)}</td></tr>`).join('')}</table></div>` : ''}
  <p class="mute">Net profit = revenue − Etsy fees − postage − material cost of sold items − failed prints − other expenses.</p>`;
  $('#rng').onchange = e => { RANGE = e.target.value; safe(dashboard); };
}
const card = (l, v, c = '', i = '', x = '') => `<div class="card ${x}"><div class="l">${i ? ic(i) : ''}${l}</div><div class="v ${c}">${v}</div></div>`;

/* ---------------- Products ---------------- */
async function products() {
  $('#main').innerHTML = `
<div class="top"><h1>Products</h1><span class="sp"></span><a class="b alt" href="/api/export/products.csv">Export CSV</a><button class="b" onclick="editProduct()">+ New product</button></div>
  <div class="wrap"><table><tr><th>Product</th><th>SKU</th><th class="r">Price</th><th class="r">Unit cost</th><th class="r">Margin</th><th class="r">Stock</th><th>Bambuddy</th><th></th></tr>
  ${PRODUCTS.map(p => `<tr style="${p.active ? '' : 'opacity:.5'}"><td>${esc(p.name)}</td><td class="mute">${esc(p.sku)}</td>
    <td class="r">${money(p.price)}</td><td class="r">${money(p.unit_cost)}</td><td class="r ${cls(p.margin_est)}">${money(p.margin_est)}</td>
    <td class="r ${p.reorder_at && p.stock <= p.reorder_at ? 'bad' : ''}">${p.stock}</td>
    <td>${p.archive_id ? `<span class="pill" title="${esc(p.archive_name)}">linked · ${p.plate_grams}g/plate</span> <button class="g" onclick="refreshBB(${p.id})">↻</button>` : '<span class="mute">—</span>'}</td>
    <td><button class="g" onclick="editProduct(${p.id})">Edit</button> <button class="g" onclick="history(${p.id})">History</button></td></tr>`).join('') || '<tr><td colspan=8 class="mute">No products yet — add your first one.</td></tr>'}
  </table></div>`;
}

async function history(id) {
  const h = await api('GET', `/api/products/${id}/history`);
  const p = PRODUCTS.find(x => x.id === id);
  const spark = kind => {
    const pts = h.filter(x => x.kind === kind); if (pts.length < 2) return '';
    const vals = pts.map(x => x.value), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
    const path = pts.map((x, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 240).toFixed(1)},${(36 - (x.value - mn) / rg * 32).toFixed(1)}`).join(' ');
    return `<svg width="250" height="40" style="display:block"><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg>`;
  };
  modal(`<h2 style="margin-top:0">${esc(p.name)} — history</h2>
  <label>Selling price</label>${spark('price') || '<div class="mute">Not enough changes to chart yet.</div>'}
  <label style="margin-top:10px">Unit cost</label>${spark('cost') || '<div class="mute">Not enough changes to chart yet.</div>'}
  <div class="wrap" style="margin-top:12px"><table><tr><th>Date</th><th>Type</th><th class="r">Value</th></tr>
  ${h.slice().reverse().map(x => `<tr><td>${x.changed_at.slice(0, 16)}</td><td>${x.kind === 'price' ? 'Price' : 'Unit cost'}</td><td class="r">${money(x.value)}</td></tr>`).join('')}</table></div>`);
}

async function importView() {

    Items are matched to products by SKU, then by exact name; unknown items create a new product (set its cost afterwards).
    Order IDs already imported are skipped, so re-importing an overlapping range is safe. Fees are auto-calculated from your Settings rates; postage you paid isn't in the CSV so add it by editing the sale.</div>
  <input type="file" id="csv" accept=".csv" style="max-width:340px"> <button class="b" id="go">Import</button><div id="res" style="margin-top:12px"></div>`;
  $('#go').onclick = () => safe(async () => {
    const f = $('#csv').files[0]; if (!f) throw new Error('Choose a CSV file first.');
    const fd = new FormData(); fd.append('file', f);

    $('#res').innerHTML = `<div class="card">Imported <b>${j.added}</b> sale lines · skipped ${j.skipped_duplicates} duplicates · created ${j.products_created} new products</div>`;
  });
}
