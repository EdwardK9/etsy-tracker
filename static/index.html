<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy Tracker</title>
<style>
:root{--inp:#0b0e14;--hover:#ffffff08;--hover2:#ffffff05;--th:#ffffff04;--glow:#1a1f2e55;--over:#05070bb0;--shadow:#00000030;--bg:#0a0c11;--side:#0e1117;--card:#131720;--card2:#181d29;--line:#222838;--text:#e9ebf2;--mute:#8a93a8;--acc:#ff7a3d;--acc2:#f0461e;--good:#34d399;--bad:#f87171;--r:14px}
*{box-sizing:border-box}
html{color-scheme:dark}
[data-theme=light]{color-scheme:light;--bg:#f4f5f8;--side:#ffffff;--card:#ffffff;--card2:#f1f3f7;--line:#e2e5ec;--text:#161a23;--mute:#667088;--inp:#ffffff;--hover:#0000000a;--hover2:#00000006;--th:#00000005;--glow:#ffd9c455;--over:#1b223080;--shadow:#1b223014;--good:#0f9d6b;--bad:#dc3d3d}
[data-theme=light] .note{color:#3b4357}[data-theme=light] .card.hero{background:linear-gradient(135deg,#ff7a3d1f,#f0461e0d),var(--card)}[data-theme=light] .modal>div{box-shadow:0 30px 80px #1b223040}[data-theme=light] #toast{box-shadow:0 12px 40px #1b223030}[data-theme=light] .logo i{box-shadow:0 6px 16px #ff7a3d55}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,var(--glow),transparent),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 10px 18px;letter-spacing:-.2px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 6px 20px #ff7a3d44}
.theme{margin-top:auto;display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:500}
.theme:hover{color:var(--text);border-color:var(--acc)}
.theme svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.subtabs{display:flex;gap:4px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.subtabs a{padding:9px 16px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs a:hover{color:var(--text)}.subtabs a.on{color:var(--text);border-bottom-color:var(--acc)}
.sub{font-size:13px;color:var(--mute);margin:0 0 8px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;align-items:start;overflow-x:auto}
.kcol{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:120px}
.kcol h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between}
.ocard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;font-size:13px}
.ocard .it{margin:4px 0;line-height:1.35}.ocard .var{color:var(--acc);font-size:12px}
.ocard .oh{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-bottom:4px}
.ocard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;background:#ff7a3d1f;color:var(--acc)}
.st.shipped{background:#34d3991a;color:var(--good)}
.print-only{display:none}
@media print{.side,.top,.kan,.no-print,#toast{display:none!important}.print-only{display:block!important;color:#000}.print-only .slip{page-break-inside:avoid;border:1px solid #000;padding:10px;margin-bottom:10px;font-size:13px}body{background:#fff}.app,main{display:block!important;padding:0!important}}
@media(max-width:820px){.theme{margin:0 0 0 auto;padding:8px}.theme span{display:none}}
.ver{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:1px}
.logo svg{width:18px;height:18px;stroke:#fff}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--mute);padding:9px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500;text-align:left;transition:.15s}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{background:var(--hover);color:var(--text)}
nav button.on{background:linear-gradient(90deg,#ff7a3d26,#ff7a3d0d);color:var(--text);box-shadow:inset 2px 0 0 var(--acc)}
nav button.on svg{color:var(--acc)}
main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1240px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.4px}
.sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 #ffffff06 inset,0 8px 24px var(--shadow)}
.card .l{color:var(--mute);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.card .l svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.6px}
.card.hero{background:linear-gradient(135deg,#ff7a3d22,#f0461e0f),var(--card);border-color:#ff7a3d44}
.good{color:var(--good)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.wrap{overflow-x:auto;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
tr+tr td{border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:var(--th)}
tbody tr:hover td,tr:hover>td{background:var(--hover2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
h2{font-size:13px;margin:26px 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button.b,a.b{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px #f0461e33;transition:.15s}
button.b:hover,a.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
a.b.alt,button.b.alt{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--text);font-weight:500}
button.g{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12px;transition:.15s}
button.g:hover{border-color:var(--acc);color:var(--text)}
input,select,textarea{background:var(--inp);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;width:100%;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #ff7a3d22}
input[type=checkbox]{accent-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:500}
.modal{position:fixed;inset:0;background:var(--over);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;z-index:20}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:580px;box-shadow:0 30px 80px #000a;animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:18px;text-transform:none;color:var(--text);letter-spacing:-.2px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:#34d3991a;color:var(--good);font-weight:600}
.pick{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;margin-top:6px;cursor:pointer;transition:.15s}
.pick:hover{border-color:var(--acc)}
.note{background:#ff7a3d10;border:1px solid #ff7a3d33;border-radius:12px;padding:12px 14px;margin-bottom:16px;color:#c9cfdd;font-size:13px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:30;box-shadow:0 12px 40px #000a}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:18px 18px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px;overflow-x:auto}
.col{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.col .bars{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center}
.col .bars span{width:42%;max-width:22px;border-radius:6px 6px 2px 2px;min-height:2px}
.col small{color:var(--mute);font-size:11px}
.legend{display:flex;gap:14px;color:var(--mute);font-size:12px;margin:-14px 0 20px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
@media(max-width:820px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:0 8px 0 4px}.logo b{display:none}nav{flex-direction:row}nav button{padding:8px 11px;white-space:nowrap}nav button span{display:none}nav button.on span{display:inline}main{padding:18px 14px 50px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg></i><b>Etsy Tracker<small id="ver" class="ver"></small></b></div><nav id="nav"></nav><button class="theme" id="theme" title="Toggle light / dark"></button></aside><main id="main"></main></div>
<div id="toast"></div>
<script>
const ICONS = {
  logo:'<path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  products:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  orders:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
  history:'<path d="M3 3v18h18M7 15l4-5 3 3 5-7"/>',
  shipping:'<path d="M2 7h12v9H2zM14 10h4l3 3v3h-7zM6 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>',
  supplies:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/><path d="M7.5 5.5l9 5"/>',
  stock:'<path d="M6 9V3h12v6M4 9h16v8H4zM8 17v4M16 17v4"/>',
  sales:'<path d="M3 3h2l2.4 11.4a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 7H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  expenses:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  import:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  listings:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  templates:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h3"/>',
  pricing:'<path d="M4 4h16v16H4zM8 8h8M8 12h3M8 16h3M14 12h2M14 16h2"/>',
  filament:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  money:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  truck:'<path d="M1 6h13v11H1zM14 10h5l3 3v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/>',
  alert:'<path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cart:'<path d="M3 3h2l2.4 11.4a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 7H6"/>',
};
const ic = n => `<svg viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {}, PRODUCTS = [];
const cur = () => S.currency || '£';
const money = n => (n < 0 ? '-' : '') + cur() + Math.abs(+n || 0).toFixed(2);
const cls = n => n > 0 ? 'good' : n < 0 ? 'bad' : '';
const today = () => new Date().toISOString().slice(0, 10);

async function api(method, url, body) {
  const r = await fetch(url, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.borderColor = bad ? 'var(--bad)' : 'var(--line)';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

const GROUPS = [
  ['dashboard', 'Dashboard', [['dashboard', 'Overview'], ['history', 'History']]],
  ['products', 'Products', [['products', 'Products'], ['listings', 'Listings'], ['templates', 'Templates']]],
  ['orders', 'Orders', [['orders', 'Board'], ['sales', 'Sales'], ['import', 'Import']]],
  ['stock', 'Stock', [['stock', 'Printing'], ['filament', 'Filament'], ['supplies', 'Supplies']]],
  ['pricing', 'Pricing', [['pricing', 'Pricing'], ['shipping', 'Shipping & boxes']]],
  ['expenses', 'Expenses', [['expenses', 'Expenses']]],
  ['settings', 'Settings', [['settings', 'Settings']]]];
const groupOf = k => GROUPS.find(g => g[2].some(x => x[0] === k)) || GROUPS[0];
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#theme'); if (b) b.innerHTML = (t === 'light' ? MOON + '<span>Dark mode</span>' : SUN + '<span>Light mode</span>');
}
(function () {
  let t = null; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light') t = 'dark';
  applyTheme(t);
  $('#theme').onclick = () => { t = t === 'light' ? 'dark' : 'light'; applyTheme(t); try { localStorage.setItem('theme', t); } catch (e) {} };
})();
function nav() {
  const cur = location.hash.slice(1) || 'dashboard';
  const g = groupOf(cur);
  $('#nav').innerHTML = GROUPS.map(([k, l, subs]) => `<button class="${k === g[0] ? 'on' : ''}" onclick="location.hash='${k === g[0] ? cur : (localStorage.getItem('sub_' + k) || subs[0][0])}'">${ic(k)}<span>${l}</span></button>`).join('');
  return cur;
}
async function route() {
  const t = nav();
  if (!route.v) { try { route.v = (await api('GET', '/api/version')).version; } catch (e) { route.v = '?'; } }
  $('#ver').textContent = 'v' + route.v;
  S = await api('GET', '/api/settings');
  PRODUCTS = await api('GET', '/api/products');
  await safe(() => VIEWS[t]());
  const g = groupOf(t);
  try { localStorage.setItem('sub_' + g[0], t); } catch (e) {}
  if (g[2].length > 1) $('#main').insertAdjacentHTML('afterbegin', `<div class="subtabs">${g[2].map(([k, l]) => `<a href="#${k}" class="${k === t ? 'on' : ''}">${l}</a>`).join('')}</div>`);
}
window.addEventListener('hashchange', route);

function modal(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div>${html}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  return m;
}
const prodOptions = (sel, activeOnly = true) => PRODUCTS.filter(p => !activeOnly || p.active || p.id == sel)
  .map(p => `<option value="${p.id}" ${p.id == sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

/* ---------------- Dashboard ---------------- */
let RANGE = 'all';
function rangeDates() {
  const d = new Date(), y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0');
  if (RANGE === 'month') return [`${y}-${m}-01`, `${y}-${m}-31`];
  if (RANGE === 'year') return [`${y}-01-01`, `${y}-12-31`];
  if (RANGE === '30') { const f = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10); return [f, today()]; }
  return ['', ''];
}
async function dashboard() {
  const [f, t] = rangeDates();
  const D = await api('GET', `/api/dashboard?from=${f}&to=${t}`);
  const T = D.totals;
  let supAlert = [];
  try { supAlert = (await api('GET', '/api/supplies')).filter(x => x.active && x.status !== 'ok'); } catch (e) {}
  const maxV = Math.max(1, ...D.months.map(m => Math.max(m.revenue, Math.abs(m.profit))));
  $('#main').innerHTML = `
  <div class="top"><h1>Dashboard</h1><span class="sp"></span><select id="rng" style="width:auto">
    ${[['all','All time'],['year','This year'],['month','This month'],['30','Last 30 days']].map(([k, l]) => `<option value="${k}" ${k === RANGE ? 'selected' : ''}>${l}</option>`).join('')}
  </select></div>
  ${supAlert.length ? `<div class="note"><b>Supplies:</b> ${supAlert.map(x => `${esc(x.name)} (${x.status === 'order_now' ? 'order now' : 'order soon'})`).join(', ')} — <a href="#supplies" style="color:var(--acc)">see Supplies</a></div>` : ''}
  ${D.goal && D.goal.target ? `<div class="card" style="margin-bottom:12px"><div class="l">${ic('trend')}Profit goal · ${money(D.goal.target)}</div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><div class="v ${cls(D.goal.net)}">${money(D.goal.net)}</div><div class="mute">${D.goal.pct}% there</div><span class="sp"></span>

async function history(id) {
  const h = await api('GET', `/api/products/${id}/history`);
  const p = PRODUCTS.find(x => x.id === id);
  const spark = kind => {
    const pts = h.filter(x => x.kind === kind); if (pts.length < 2) return '';
    const vals = pts.map(x => x.value), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
    const path = pts.map((x, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 240).toFixed(1)},${(36 - (x.value - mn) / rg * 32).toFixed(1)}`).join(' ');
    return `<svg width="250" height="40" style="display:block"><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg>`;
  };
  modal(`<h2 style="margin-top:0">${esc(p.name)} — history</h2>
  ${stepChart([{name: 'Selling price', color: PAL[0], pts: toPts(h, 'price')}, {name: 'Unit cost', color: PAL[2], pts: toPts(h, 'cost'), dash: true}], 540, 220)}
  <div class="wrap" style="margin-top:12px"><table><tr><th>Date</th><th>Type</th><th class="r">Value</th></tr>
  ${h.slice().reverse().map(x => `<tr><td>${x.changed_at.slice(0, 16)}</td><td>${x.kind === 'price' ? 'Price' : 'Unit cost'}</td><td class="r">${money(x.value)}</td></tr>`).join('')}</table></div>`);
}

/* ---------------- Pricing ---------------- */
function feeModel(offsite) {
  const r = ((+S.fee_transaction_pct || 0) + (+S.fee_processing_pct || 0) + (+S.fee_regulatory_pct || 0) + (offsite ? (+S.fee_offsite_ads_pct || 0) : 0)) / 100 * (1 + (+S.fee_vat_pct || 0) / 100);
  const F = ((+S.fee_processing_fixed || 0) + (+S.fee_listing_per_item || 0)) * (1 + (+S.fee_vat_pct || 0) / 100);
  return {r, F};
}
function priceCalc({cost, ship, postage, offsite, mode, target}) {
  const {r, F} = feeModel(offsite);
  const fixed = F + postage + cost;
  let price;
  if (mode === 'margin') { const d = 1 - r - target / 100; price = d > 0 ? fixed / d - ship : NaN; }
  else price = ((target + fixed) / (1 - r)) - ship;
  return price;
}
function profitAt(price, {cost, ship, postage, offsite}) {
  const {r, F} = feeModel(offsite);
  const gross = price + ship, fees = gross * r + F, profit = gross - fees - postage - cost;
  return {gross, fees, profit, margin: gross ? profit / gross * 100 : 0};
}
async function pricing() {
  const act = PRODUCTS.filter(p => p.active);
  const dpost = +S.default_postage_cost || 0, dship = +S.default_shipping_charged || 0, dm = +S.target_margin_pct || 40;
  $('#main').innerHTML = `<div class="top"><h1>Pricing calculator</h1></div>
  <div class="note">Works out the price you need after Etsy fees (using your Settings rates), postage and material. Fees are estimates — check them against a real Etsy statement.</div>
  <div class="card" style="margin-bottom:18px"><div class="grid">
    <div class="full"><label>Start from a product (fills the cost)</label><select id="pc_prod"><option value="">— manual —</option>${act.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div><label>Cost to make one (£)</label><input id="pc_cost" type="number" step="0.01" value="0"></div>
    <div><label>Postage you pay (£)</label><input id="pc_post" type="number" step="0.01" value="${dpost}"></div>
    <div><label>Shipping you charge the buyer (£)</label><input id="pc_ship" type="number" step="0.01" value="${dship}"></div>
    <div><label><input type="checkbox" id="pc_ad" style="width:auto"> Sold via Offsite Ads</label></div>
    <div><label>I want to target</label><select id="pc_mode"><option value="margin">a profit margin %</option><option value="profit">a profit amount £</option></select></div>
    <div><label id="pc_tl">Target margin %</label><input id="pc_target" type="number" step="0.5" value="${dm}"></div>
  </div></div>
  <div id="pc_out"></div>
  <h2>All products at their current price</h2>
  <div class="wrap"><table><tr><th>Product</th><th class="r">Price</th><th class="r">Cost</th><th class="r">Profit</th><th class="r">Margin</th><th class="r">Price for ${dm}%</th></tr>
  ${act.map(p => { const o = {cost: p.unit_cost, ship: dship, postage: p.postage_cost > 0 ? p.postage_cost : dpost, offsite: false}; const r = profitAt(p.price, o); const tp = priceCalc({...o, mode: 'margin', target: dm});
    return `<tr><td>${esc(p.name)}</td><td class="r">${money(p.price)}</td><td class="r">${money(p.unit_cost)}</td><td class="r ${cls(r.profit)}">${money(r.profit)}</td><td class="r ${cls(r.margin - dm)}">${r.margin.toFixed(0)}%</td><td class="r">${isFinite(tp) ? money(Math.ceil(tp * 20) / 20) : '—'}</td></tr>`; }).join('') || '<tr><td colspan=6 class="mute">No products yet.</td></tr>'}
  </table></div><p class="mute">Profit here is for a single item using each product's saved postage (from the Shipping tab) or your default from Settings, plus your default shipping charge.</p>`;
  const g = id => $(id);
  const calc = () => {
    const o = {cost: +g('#pc_cost').value || 0, ship: +g('#pc_ship').value || 0, postage: +g('#pc_post').value || 0, offsite: g('#pc_ad').checked};
    const mode = g('#pc_mode').value, target = +g('#pc_target').value || 0;
    g('#pc_tl').textContent = mode === 'margin' ? 'Target margin %' : 'Target profit per item (£)';
    const be = priceCalc({...o, mode: 'profit', target: 0});
    const want = priceCalc({...o, mode, target});
    if (!isFinite(want)) { g('#pc_out').innerHTML = '<div class="note">That margin isn’t reachable — fees alone take too much. Try a lower target.</div>'; return; }
    const nice = Math.ceil(want * 20) / 20;
    const prod = g('#pc_prod').value;
    const ladder = [-1, -.5, 0, .5, 1, 2].map(d => Math.max(nice + d, 0.5));
    g('#pc_out').innerHTML = `<div class="cards">${card('Break-even price', money(Math.max(be, 0)), '', 'alert')}${card('Price for your target', money(nice), 'good', 'money', 'hero')}
      ${card('Profit per item', money(profitAt(nice, o).profit), cls(profitAt(nice, o).profit), 'trend')}${card('Margin', profitAt(nice, o).margin.toFixed(0) + '%', '', 'tag')}</div>
      <div class="wrap"><table><tr><th>Price</th><th class="r">Etsy fees</th><th class="r">Postage</th><th class="r">Cost</th><th class="r">Profit</th><th class="r">Margin</th></tr>
      ${ladder.map(pr => { const r = profitAt(pr, o); return `<tr style="${Math.abs(pr - nice) < 1e-9 ? 'background:#ff7a3d14' : ''}"><td>${money(pr)}</td><td class="r">${money(-r.fees)}</td><td class="r">${money(-o.postage)}</td><td class="r">${money(-o.cost)}</td><td class="r ${cls(r.profit)}">${money(r.profit)}</td><td class="r">${r.margin.toFixed(0)}%</td></tr>`; }).join('')}</table></div>

/* ---------------- Shipping calculator ---------------- */
function shipOptions(rates, g, dims) {
  const d = dims.filter(x => x > 0).sort((a, b) => b - a); while (d.length < 3) d.push(0);
  return rates.map(s => {
    const lim = [...s.dims].sort((a, b) => b - a);
    const fitsSize = d.every((x, i) => x <= lim[i]);
    const tier = s.tiers.find(t => g <= t[0]);
    return {...s, fitsSize, tier, price: tier ? tier[1] : null, ok: fitsSize && !!tier};
  });
}

/* ---------------- History (charts) ---------------- */
const PAL = ['#ff7a3d','#34d399','#60a5fa','#f472b6','#fbbf24','#a78bfa','#2dd4bf','#f87171'];
function stepChart(series, w = 760, hgt = 260) {
  // series: [{name,color,pts:[{t:ms,v}]}] drawn as step lines extended to "now"
  const all = series.flatMap(s => s.pts); if (!all.length) return '<div class="mute">No data yet — changes to price or cost are recorded automatically.</div>';
  const now = Date.now(), t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(now, t0 + 86400000);
  let mn = Math.min(...all.map(p => p.v)), mx = Math.max(...all.map(p => p.v)); const pad = (mx - mn || 1) * .15; mn = Math.max(0, mn - pad); mx += pad;
  const L = 48, R = 14, T = 12, B = 26, X = t => L + (t - t0) / (t1 - t0) * (w - L - R), Y = v => T + (1 - (v - mn) / (mx - mn)) * (hgt - T - B);
  const grid = [0, .25, .5, .75, 1].map(f => { const v = mn + (mx - mn) * f; return `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" fill="var(--mute)" font-size="10">£${v.toFixed(2)}</text>`; }).join('');
  const xl = [0, .5, 1].map(f => { const t = t0 + (t1 - t0) * f; return `<text x="${X(t)}" y="${hgt - 8}" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}" fill="var(--mute)" font-size="10">${new Date(t).toISOString().slice(0, 10)}</text>`; }).join('');
  const lines = series.map(s => {
    const pts = s.pts; if (!pts.length) return '';
    let d = `M${X(pts[0].t)},${Y(pts[0].v)}`;
    pts.slice(1).forEach(p => d += ` H${X(p.t)} V${Y(p.v)}`); d += ` H${X(t1)}`;
    const dots = pts.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"><title>${s.name}: £${p.v.toFixed(2)} — ${new Date(p.t).toISOString().slice(0, 10)}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"${s.dash ? ' stroke-dasharray="6 4"' : ''}/>${dots}`;
  }).join('');
  const legend = `<div class="legend" style="margin:8px 0 0">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${w} ${hgt}" style="width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)">${grid}${xl}${lines}</svg>${legend}`;
}
const toPts = (h, kind) => h.filter(x => x.kind === kind).map(x => ({t: new Date(x.changed_at.replace(' ', 'T') + 'Z').getTime(), v: x.value}));
async function historyView() {
  const H = await api('GET', '/api/history');
  const sel = localStorage.getItem('histSel') || 'all';
  const ps = PRODUCTS.filter(p => H.some(x => x.product_id === p.id));
  let body = '', stats = '';
  if (sel === 'all') {
    body = `<h3 class="sub">Selling price — all products</h3>` + stepChart(ps.map((p, i) => ({name: p.name, color: PAL[i % PAL.length], pts: toPts(H.filter(x => x.product_id === p.id), 'price')})));
    stats = `<div class="wrap" style="margin-top:16px"><table><tr><th>Product</th><th class="r">First price</th><th class="r">Now</th><th class="r">Change</th><th class="r">Price changes</th></tr>${ps.map(p => {
      const pr = toPts(H.filter(x => x.product_id === p.id), 'price'); if (!pr.length) return ''; const f = pr[0].v, n = pr[pr.length - 1].v;
      return `<tr><td>${esc(p.name)}</td><td class="r">${money(f)}</td><td class="r">${money(n)}</td><td class="r ${cls(n - f)}">${n - f >= 0 ? '+' : ''}${money(n - f)}</td><td class="r">${pr.length - 1}</td></tr>`; }).join('')}</table></div>`;
  } else {
    const id = +sel, p = PRODUCTS.find(x => x.id === id), hh = H.filter(x => x.product_id === id);
    const pr = toPts(hh, 'price'), co = toPts(hh, 'cost');
    // margin series: at each change time, price-in-force minus cost-in-force
    const times = [...new Set([...pr, ...co].map(x => x.t))].sort((x, y) => x - y);
    const at = (arr, t) => { let v = null; arr.forEach(x => { if (x.t <= t) v = x.v; }); return v; };
    const mg = times.map(t => ({t, v: (at(pr, t) ?? 0) - (at(co, t) ?? 0)})).filter((x, i) => at(pr, x.t) !== null && at(co, x.t) !== null);
    body = `<h3 class="sub">Price vs cost</h3>` + stepChart([{name: 'Selling price', color: PAL[0], pts: pr}, {name: 'Unit cost', color: PAL[2], pts: co, dash: true}, {name: 'Margin per item', color: PAL[1], pts: mg}]);
    stats = `<div class="wrap" style="margin-top:16px"><table><tr><th>When</th><th>Type</th><th class="r">Value</th></tr>${hh.slice().reverse().map(x => `<tr><td>${x.changed_at.slice(0, 16)}</td><td>${x.kind === 'price' ? 'Price' : 'Unit cost'}</td><td class="r">${money(x.value)}</td></tr>`).join('')}</table></div>`;
  }
  $('#main').innerHTML = `<div class="top"><h1>History</h1><span class="sp"></span>
    <select id="hsel" style="width:auto"><option value="all">All products — prices</option>${PRODUCTS.map(p => `<option value="${p.id}" ${String(p.id) === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div class="note">Every change to a product's selling price or unit cost (e.g. after a Bambuddy refresh, new filament price or labour change) is logged automatically, so these charts fill in over time.</div>
  ${body}${stats}`;
  $('#hsel').onchange = e => { localStorage.setItem('histSel', e.target.value); route(); };
}

    <div><label>Date</label><input id="e_d" type="date" value="${today()}"></div>
    <div><label>Amount (${cur()})</label><input id="e_a" type="number" step="0.01"></div>
    <div class="full"><label>Category</label><select id="e_c">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="full"><label>Description</label><input id="e_t"></div></div>
  <div class="bar" style="margin-top:14px"><button class="b" id="ok">Save</button><button class="g" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  $('#ok', m).onclick = () => safe(async () => {
    await api('POST', '/api/expenses', {date: $('#e_d', m).value, amount: $('#e_a', m).value, category: $('#e_c', m).value, description: $('#e_t', m).value});
    m.remove(); route();
  });
}
async function del(t, id) { if (confirm('Delete this entry?')) await safe(async () => { await api('DELETE', `/api/${t}/${id}`); route(); }); }

/* ---------------- Import ---------------- */
async function importView() {
  $('#main').innerHTML = `<div class="top"><h1>Import from Etsy</h1></div><div class="note">
    Download your orders from Etsy: <b>Shop Manager → Settings → Options → Download Data</b>, pick <b>Order Items</b> and a date range, then upload the CSV here.
    Items are matched to products by SKU, then by exact name; unknown items create a new product (set its cost afterwards).
    Order IDs already imported are skipped, so re-importing an overlapping range is safe. Fees are auto-calculated from your Settings rates; postage you paid isn't in the CSV so add it by editing the sale.</div>
  <input type="file" id="csv" accept=".csv" style="max-width:340px"> <button class="b" id="go">Import</button><div id="res" style="margin-top:12px"></div>`;
  $('#go').onclick = () => safe(async () => {
    const f = $('#csv').files[0]; if (!f) throw new Error('Choose a CSV file first.');
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/api/import/etsy', {method: 'POST', body: fd}); const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    $('#res').innerHTML = `<div class="card">Imported <b>${j.added}</b> sale lines · skipped ${j.skipped_duplicates} duplicates · created ${j.products_created} new products</div>`;
  });
}

/* ---------------- Settings ---------------- */
async function settingsView() {
  const f = (k, l, t = 'text') => `<div><label>${l}</label><input data-k="${k}" type="${t}" step="any" value="${esc(S[k])}"></div>`;
  $('#main').innerHTML = `
  <div class="top"><h1>Settings</h1></div>
  <h2 style="margin-top:0">Bambuddy link</h2>
  <div class="grid" style="max-width:700px">
    <div class="full"><label>Bambuddy URL (e.g. http://192.168.1.10:8000)</label><input data-k="bambuddy_url" value="${esc(S.bambuddy_url)}"></div>
    <div class="full"><label>API key ${S.bambuddy_key_set ? '(saved — leave as is to keep)' : ''}</label><input data-k="bambuddy_key" type="password" value="${esc(S.bambuddy_key)}"></div>
    ${f('default_cost_per_kg', 'Fallback filament £/kg (if an archive has no cost)', 'number')}
    ${f('colour_min_remaining_g', 'A filament colour counts as available above (grams left)', 'number')}
  </div>
  <p class="mute">In Bambuddy create an API key with the <b>Read Status</b> permission (Settings → API Keys).</p>
  <div class="bar"><button class="g" id="test">Test connection</button><span id="tres"></span></div>
  <h2>Etsy connection</h2>
  <div class="grid" style="max-width:700px">
    <div><label>API keystring</label><input data-k="etsy_keystring" value="${esc(S.etsy_keystring)}"></div>
    <div><label>Shared secret ${S.etsy_secret_set ? '(saved — leave blank to keep)' : ''}</label><input data-k="etsy_secret" type="password" value=""></div>
    <div class="full"><label>Redirect URL (must be https and registered on your Etsy app exactly)</label><input data-k="etsy_redirect_uri" placeholder="https://example.com/etsy/callback" value="${esc(S.etsy_redirect_uri)}"></div>
  </div>
  ${S.etsy_connected ? `<div class="bar" style="margin-top:12px"><span class="pill">Connected · ${esc(S.etsy_shop_name || 'shop')}</span>
      <button class="b" id="esync">Sync orders now</button><button class="g" id="efull">Full re-sync</button><button class="g" id="esample">Show sample data</button><button class="g" id="edisc">Disconnect</button></div>` : ''}
  <div id="eres" class="mute"></div>
  ${(!S.etsy_connected || !S.etsy_can_list) ? `<div class="note" style="margin-top:12px;max-width:700px">
      ${S.etsy_connected ? '<b>Re-authorise needed</b> to let the app create listing drafts (a one-off). ' : '<b>Connect:</b> '}Save the details above, click <b>Open Etsy login</b> and approve access. Etsy then sends you to your redirect URL — that page may show an error, which is fine.
      Copy the <b>full address from the browser bar</b> and paste it below.
      <div class="bar" style="margin:10px 0 0"><button class="b alt" id="eopen">Open Etsy login</button></div>
      <div style="display:flex;gap:6px;margin-top:8px"><input id="epaste" placeholder="https://…?code=…&state=…" style="flex:1"><button class="b" id="econn">Connect</button></div></div>` : ''}
  <h2>Listing defaults (used when creating Etsy drafts)</h2>
  <div class="grid" style="max-width:700px">
    <div><label>Shipping profile</label><select data-k="listing_shipping_profile_id" id="l_ship"><option value="${esc(S.listing_shipping_profile_id)}">${S.listing_shipping_profile_id ? 'Saved (' + esc(S.listing_shipping_profile_id) + ')' : (S.etsy_connected ? 'Loading…' : 'Connect Etsy first')}</option></select></div>
    <div><label>Processing time profile</label><select data-k="listing_readiness_state_id" id="l_proc"><option value="${esc(S.listing_readiness_state_id)}">${S.listing_readiness_state_id ? 'Saved (' + esc(S.listing_readiness_state_id) + ')' : (S.etsy_connected ? 'Loading…' : 'Connect Etsy first')}</option></select></div>
    <div><label>Returns policy</label><select data-k="listing_return_policy_id" id="l_retd"><option value="${esc(S.listing_return_policy_id)}">${S.listing_return_policy_id ? 'Saved (' + esc(S.listing_return_policy_id) + ')' : (S.etsy_connected ? 'Loading…' : 'Connect Etsy first')}</option></select></div>
    <div><label>Shop section</label><select data-k="listing_shop_section_id" id="l_secd"><option value="${esc(S.listing_shop_section_id)}">${S.listing_shop_section_id ? 'Saved (' + esc(S.listing_shop_section_id) + ')' : (S.etsy_connected ? 'Loading…' : 'Connect Etsy first')}</option></select></div>
    <div><label>Auto-renew listings</label><select data-k="listing_auto_renew"><option value="0" ${S.listing_auto_renew !== '1' ? 'selected' : ''}>Manual renewal</option><option value="1" ${S.listing_auto_renew === '1' ? 'selected' : ''}>Automatic</option></select></div>
    <div><label>Who made it</label><select data-k="listing_who_made">${[['i_did','I did'],['collective','A member of my shop'],['someone_else','Another company or person']].map(([v, l]) => `<option value="${v}" ${S.listing_who_made === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div><label>When made</label><select data-k="listing_when_made">${[['made_to_order','Made to order'],['2020_2026','2020–2026']].map(([v, l]) => `<option value="${v}" ${S.listing_when_made === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    ${f('listing_quantity', 'Default stock quantity on new drafts', 'number')}${f('listing_materials', 'Default materials (comma separated)')}
    <div class="full"><label>Tags added to every listing (comma separated, max 13 total, 20 chars each)</label><input data-k="listing_default_tags" value="${esc(S.listing_default_tags)}"></div>
    <div class="full"><label>Description template — {name} becomes the product name</label><textarea data-k="listing_desc_template" rows="4">${esc(S.listing_desc_template)}</textarea></div>
  </div>
  <h2>Pricing & goal</h2>
  <div class="grid" style="max-width:700px">
    ${f('goal_amount', 'Profit goal (£)', 'number')}${f('target_margin_pct', 'Target profit margin %', 'number')}
    ${f('electricity_price_per_kwh', 'Electricity price per kWh (£) — used if Bambuddy has kWh but no cost', 'number')}${f('labour_rate_per_hour', 'Your hands-on rate per hour (£, optional)', 'number')}
    ${f('default_postage_cost', 'Typical postage cost you pay per order (£)', 'number')}${f('default_shipping_charged', 'Typical shipping you charge the buyer (£)', 'number')}
  </div>
  <h2>Etsy fee rates (used when a sale's fees are left blank)</h2>
  <div class="grid" style="max-width:700px">
    ${f('currency', 'Currency symbol')}${f('fee_transaction_pct', 'Transaction fee %', 'number')}
    ${f('fee_processing_pct', 'Payment processing %', 'number')}${f('fee_processing_fixed', 'Payment processing fixed per order', 'number')}
    ${f('fee_regulatory_pct', 'Regulatory operating fee %', 'number')}${f('fee_listing_per_item', 'Listing/renewal fee per item sold', 'number')}
    ${f('fee_vat_pct', 'VAT on fees %', 'number')}${f('fee_offsite_ads_pct', 'Offsite ads fee %', 'number')}
  </div>
  <p class="mute">These are starting defaults — compare a few sales against your Etsy payment statement and tweak until they match. Fees already saved on past sales don't change.</p>
  <div class="bar"><button class="b" id="save">Save settings</button><span class="sp"></span><a class="b alt" href="/api/backup">Download database backup</a></div>`;
  const collect = () => Object.fromEntries([...document.querySelectorAll('[data-k]')].map(e => [e.dataset.k, e.value]));
  $('#save').onclick = () => safe(async () => { await api('PUT', '/api/settings', collect()); toast('Saved'); route(); });
  const eres = t => { const e = $('#eres'); if (e) e.innerHTML = t; };
  const fillSel = async (id, url, cur) => { try { const L = await api('GET', url); const el = $(id); el.innerHTML = '<option value="">— none —</option>' + L.map(x => `<option value="${x.id}" ${String(x.id) === String(cur) ? 'selected' : ''}>${esc(x.title)}</option>`).join(''); } catch (e) { $(id).options[0].textContent = 'Could not load: ' + e.message.slice(0, 60); } };
  if (S.etsy_connected) { fillSel('#l_ship', '/api/etsy/shipping-profiles', S.listing_shipping_profile_id); fillSel('#l_proc', '/api/etsy/processing-profiles', S.listing_readiness_state_id); fillSel('#l_retd', '/api/etsy/return-policies', S.listing_return_policy_id); fillSel('#l_secd', '/api/etsy/shop-sections', S.listing_shop_section_id); }
  const syncRun = (full) => safe(async () => {
    eres('Syncing…');
    try { const r = await api('POST', '/api/etsy/sync', {full}); eres(`<span class="good">Imported ${r.added} sale lines</span> · ${r.skipped_duplicates} already had · ${r.products_created} new products${r.receipts_with_refunds ? ' · ' + r.receipts_with_refunds + ' orders have refunds (check them)' : ''}`); }
    catch (e) { eres(`<span class="bad">${esc(e.message)}</span>`); }
  });
  if ($('#eopen')) $('#eopen').onclick = () => safe(async () => {
    await api('PUT', '/api/settings', collect());
    const r = await api('POST', '/api/etsy/auth-url'); window.open(r.url, '_blank');
  });
  if ($('#econn')) $('#econn').onclick = () => safe(async () => {
    try { const r = await api('POST', '/api/etsy/connect', {url: $('#epaste').value}); toast('Connected to ' + r.shop); route(); }
    catch (e) { eres(`<span class="bad">${esc(e.message)}</span>`); }
  });
  if ($('#esync')) { $('#esync').onclick = () => syncRun(false); $('#efull').onclick = () => syncRun(true);
    $('#edisc').onclick = () => safe(async () => { await api('POST', '/api/etsy/disconnect'); route(); });
    $('#esample').onclick = () => safe(async () => { const r = await api('GET', '/api/etsy/sample');
      modal(`<h2 style="margin-top:0">Etsy sample data</h2><p class="mute">Personal details are stripped. Send this to Claude if fees or fields look wrong.</p><textarea rows="16" style="font-family:monospace;font-size:12px" readonly>${esc(JSON.stringify(r, null, 1))}</textarea>`); }); }

  $('#test').onclick = () => safe(async () => {
    await api('PUT', '/api/settings', collect());
    try { const r = await api('GET', '/api/bambuddy/test'); $('#tres').innerHTML = `<span class="good">Connected${r.spools != null ? ' · ' + r.spools + ' spools found' : ''}</span>`; }
    catch (e) { $('#tres').innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  });
}

const VIEWS = {dashboard, products, listings, templates, pricing, shipping, history: historyView, filament, stock, supplies, orders, sales, expenses, import: importView, settings: settingsView};
route();
</script>
